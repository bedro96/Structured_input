[project]
name = "structured-input"
version = "0.1.0"
description = "Microsoft Foundry Agent with structured input delivered to HTTP Streamable MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.19.0",
    "fastmcp>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "openai>=1.75.0",
    "aiohttp>=3.11.0",
]

[project.scripts]
console-app = "src.console_app:main"
api-server = "src.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
